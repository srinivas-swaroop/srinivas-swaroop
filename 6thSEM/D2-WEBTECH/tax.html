<!DOCTYPE html>
<html>
<head> 
    <title>Tax Calculator</title>
</head>

<style>
    /* body{
        font-family: Arial;
        background: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    } */

    div{
        margin: 8px;
    }

    /* body > div{
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
        text-align: center;
    } */

    input, select, button{
        padding: 8px;
        width: 180px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button{
        background: #4CAF50;
        color: white;
        cursor: pointer;
    }

    button:hover{
        background: #45a049;
    }
</style>

<body>
    <div>
        <div>
            <select id="year">
                <option>2020-21</option>
                <option>2021-22</option>
            </select>
        </div>

        <div>
            <select id="gender">
                <option> Male </option>
                <option> Female </option>
            </select>
        </div>

        <div>
            <input id="res" placeholder="Enter Income">
        </div>

        <div>
            <button onclick="cal()">Find</button>
        </div>

        <input id="ptr" placeholder="Find PTR here" readonly>
    </div>

    <script>
       function cal(){
            let val = Number(res.value);
            let amount = 0;

            if(val > 1000){
                amount = val*0.2+val;
            } else{
                amount = val*0.5+val;
            }

            document.getElementById("ptr").value = amount;
        }

    </script>
</body>
</html>
