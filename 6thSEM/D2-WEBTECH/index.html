<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6x6 SudokoSolver</title>

    <style>
        td {width : 40px; height: 40px ; text-align: center; border : 1px solid}
        input{width: 35px; height: 35px;}
    </style>
</head>
<body>
    <table id="s"></table>
    <button onclick="solve()">Show Solution</button>

    <script>
        let p = [[1,0,3,0,5,6], [1,2,0,5,6,0], [0,1,2,0,1,0]];
        let s = [[1,2,3,4,5,6], [1,2,4,5,6,3], [1,1,2,3,1,3]]; 

        let d = document.getElementById("s");

        for(let i =0; i<2; i++){
            let r = d.insertRow();
            for(let j=0; j<3; j++){
                let c = r.insertCell();

                c.innerHTML = p[i][j] ? p[i][j] : "<input>";
            }
        }

        function solve(){
            for(let i =0; i<2; i++){
            for(let j=0; j<3; j++){
                d.rows[i].cells[j].innerHTML = s[i][j];
            }
        }
        }
    </script>
</body>
</html>
